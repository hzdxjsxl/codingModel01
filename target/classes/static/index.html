<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimCity 2.5D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }

        .controls h3 {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .controls p {
            font-size: 12px;
            color: #aaa;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            perspective: 2000px;
            overflow: hidden;
            position: relative;
        }

        #iso-map {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg) translate(-50%, -50%);
            transform-origin: center center;
        }

        .tile {
            position: absolute;
            width: 64px;
            height: 64px;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .tile:hover {
            transform: translateZ(10px);
        }

        .tile-top {
            position: absolute;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4a7c59 0%, #6b8e23 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tile-water {
            background: linear-gradient(135deg, #1e90ff 0%, #4169e1 100%) !important;
        }

        .tile-grass {
            background: linear-gradient(135deg, #4a7c59 0%, #6b8e23 100%) !important;
        }

        .tile-sand {
            background: linear-gradient(135deg, #f4d03f 0%, #d4ac0d 100%) !important;
        }

        .building {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transform-style: preserve-3d;
        }

        .building-residential {
            width: 40px;
            height: 60px;
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
        }

        .building-commercial {
            width: 50px;
            height: 80px;
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
        }

        .building-industrial {
            width: 55px;
            height: 70px;
            background: linear-gradient(180deg, #95a5a6 0%, #7f8c8d 100%);
        }

        .building-park {
            width: 45px;
            height: 30px;
            background: linear-gradient(180deg, #27ae60 0%, #229954 100%);
            border-radius: 50% 50% 0 0;
        }

        .path-tile {
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .path-tile .tile-top {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.5) 0%, rgba(255, 165, 0, 0.5) 100%) !important;
        }

        #player {
            position: absolute;
            width: 32px;
            height: 48px;
            z-index: 10000;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .player-sprite {
            width: 32px;
            height: 48px;
            background: linear-gradient(180deg, #e91e63 0%, #ad1457 100%);
            border-radius: 16px 16px 8px 8px;
            position: relative;
        }

        .player-sprite::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #ffcc80;
            border-radius: 50%;
        }

        .player-walking .player-sprite {
            animation: walk 0.3s steps(2) infinite;
        }

        @keyframes walk {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .start-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #4caf50;
            border-radius: 50%;
            z-index: 9999;
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
        }

        .end-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff5722;
            border-radius: 50%;
            z-index: 9999;
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.8);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 99999;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">加载地图中...</div>
    
    <div class="controls">
        <h3>操作说明</h3>
        <p>点击地图设置起点（绿色）</p>
        <p>再次点击设置终点（红色）</p>
        <p>小人会自动寻路移动</p>
    </div>

    <div id="game-container">
        <div id="iso-map"></div>
    </div>

    <div id="player" style="display: none;">
        <div class="player-sprite"></div>
    </div>

    <script>
        const CONFIG = {
            tileSize: 64,
            mapWidth: 100,
            mapHeight: 100,
            apiUrl: 'http://localhost:9090/api/map'
        };

        let mapData = [];
        let startPoint = null;
        let endPoint = null;
        let path = [];
        let currentPathMarkers = [];
        let player = null;

        class IsometricCoordinate {
            static cartesianToIsometric(x, y) {
                const isoX = (x - y) * (CONFIG.tileSize / 2);
                const isoY = (x + y) * (CONFIG.tileSize / 4);
                return { isoX, isoY };
            }

            static isometricToCartesian(isoX, isoY) {
                const x = (isoX / (CONFIG.tileSize / 2) + isoY / (CONFIG.tileSize / 4)) / 2;
                const y = (isoY / (CONFIG.tileSize / 4) - isoX / (CONFIG.tileSize / 2)) / 2;
                return { x: Math.floor(x), y: Math.floor(y) };
            }

            static getDepth(x, y, elevation = 0) {
                return x + y + elevation * 100;
            }
        }

        class AStarPathfinder {
            constructor(grid) {
                this.grid = grid;
            }

            findPath(startX, startY, endX, endY) {
                const openList = [];
                const closedList = new Set();
                const startNode = {
                    x: startX,
                    y: startY,
                    g: 0,
                    h: this.heuristic(startX, startY, endX, endY),
                    f: 0,
                    parent: null
                };
                startNode.f = startNode.g + startNode.h;
                openList.push(startNode);

                while (openList.length > 0) {
                    openList.sort((a, b) => a.f - b.f);
                    const currentNode = openList.shift();

                    if (currentNode.x === endX && currentNode.y === endY) {
                        return this.reconstructPath(currentNode);
                    }

                    closedList.add(`${currentNode.x},${currentNode.y}`);

                    const neighbors = this.getNeighbors(currentNode.x, currentNode.y);
                    for (const neighbor of neighbors) {
                        if (closedList.has(`${neighbor.x},${neighbor.y}`)) continue;

                        const tentativeG = currentNode.g + 1;
                        const existingNode = openList.find(n => n.x === neighbor.x && n.y === neighbor.y);

                        if (!existingNode) {
                            const newNode = {
                                x: neighbor.x,
                                y: neighbor.y,
                                g: tentativeG,
                                h: this.heuristic(neighbor.x, neighbor.y, endX, endY),
                                f: 0,
                                parent: currentNode
                            };
                            newNode.f = newNode.g + newNode.h;
                            openList.push(newNode);
                        } else if (tentativeG < existingNode.g) {
                            existingNode.g = tentativeG;
                            existingNode.f = existingNode.g + existingNode.h;
                            existingNode.parent = currentNode;
                        }
                    }
                }

                return null;
            }

            heuristic(x1, y1, x2, y2) {
                return Math.abs(x1 - x2) + Math.abs(y1 - y2);
            }

            getNeighbors(x, y) {
                const neighbors = [];
                const directions = [
                    { dx: 0, dy: -1 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 },
                    { dx: 1, dy: 0 }
                ];

                for (const dir of directions) {
                    const nx = x + dir.dx;
                    const ny = y + dir.dy;

                    if (nx >= 0 && nx < CONFIG.mapWidth && 
                        ny >= 0 && ny < CONFIG.mapHeight &&
                        !this.isObstacle(nx, ny)) {
                        neighbors.push({ x: nx, y: ny });
                    }
                }

                return neighbors;
            }

            isObstacle(x, y) {
                if (y >= 0 && y < mapData.length && x >= 0 && x < mapData[y].length) {
                    const tile = mapData[y][x];
                    return tile.buildingTypeId > 0 && tile.buildingTypeId !== 4;
                }
                return true;
            }

            reconstructPath(node) {
                const path = [];
                let current = node;
                while (current) {
                    path.unshift({ x: current.x, y: current.y });
                    current = current.parent;
                }
                return path;
            }
        }

        class MapRenderer {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.tiles = [];
            }

            render() {
                this.container.innerHTML = '';
                this.tiles = [];

                const sortedTiles = [];
                for (let y = 0; y < mapData.length; y++) {
                    for (let x = 0; x < mapData[y].length; x++) {
                        const tile = mapData[y][x];
                        const depth = IsometricCoordinate.getDepth(x, y, tile.elevation);
                        sortedTiles.push({ x, y, tile, depth });
                    }
                }

                sortedTiles.sort((a, b) => a.depth - b.depth);

                for (const item of sortedTiles) {
                    this.createTile(item.x, item.y, item.tile);
                }
            }

            createTile(x, y, tileData) {
                const { isoX, isoY } = IsometricCoordinate.cartesianToIsometric(x, y);
                const depth = IsometricCoordinate.getDepth(x, y, tileData.elevation);

                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.x = x;
                tile.dataset.y = y;
                tile.style.left = `${isoX}px`;
                tile.style.top = `${isoY}px`;
                tile.style.zIndex = Math.floor(depth);

                const tileTop = document.createElement('div');
                tileTop.className = 'tile-top';

                if (tileData.elevation < 1) {
                    tileTop.classList.add('tile-water');
                } else if (tileData.elevation < 3) {
                    tileTop.classList.add('tile-grass');
                } else {
                    tileTop.classList.add('tile-sand');
                }

                tile.style.transform = `translateZ(${tileData.elevation * 10}px)`;
                tile.appendChild(tileTop);

                if (tileData.buildingTypeId > 0) {
                    const building = document.createElement('div');
                    building.className = 'building';
                    
                    switch (tileData.buildingTypeId) {
                        case 1:
                            building.classList.add('building-residential');
                            break;
                        case 2:
                            building.classList.add('building-commercial');
                            break;
                        case 3:
                            building.classList.add('building-industrial');
                            break;
                        case 4:
                            building.classList.add('building-park');
                            break;
                    }
                    tile.appendChild(building);
                }

                tile.addEventListener('click', (e) => this.handleTileClick(x, y, e));
                this.container.appendChild(tile);
                this.tiles.push({ element: tile, x, y });
            }

            handleTileClick(x, y, event) {
                const tile = mapData[y][x];
                
                if (tile.buildingTypeId > 0 && tile.buildingTypeId !== 4) {
                    console.log('Cannot set point on building!');
                    return;
                }

                if (!startPoint) {
                    startPoint = { x, y };
                    this.showMarker(x, y, 'start-marker');
                    console.log('Start point set:', x, y);
                } else if (!endPoint) {
                    endPoint = { x, y };
                    this.showMarker(x, y, 'end-marker');
                    console.log('End point set:', x, y);
                    this.calculatePath();
                } else {
                    this.clearMarkers();
                    startPoint = { x, y };
                    endPoint = null;
                    path = [];
                    this.showMarker(x, y, 'start-marker');
                    console.log('Start point reset:', x, y);
                }
            }

            showMarker(x, y, className) {
                const { isoX, isoY } = IsometricCoordinate.cartesianToIsometric(x, y);
                const marker = document.createElement('div');
                marker.className = className;
                marker.style.left = `${isoX + CONFIG.tileSize / 2 - 10}px`;
                marker.style.top = `${isoY + CONFIG.tileSize / 2 - 10}px`;
                this.container.appendChild(marker);
                currentPathMarkers.push(marker);
            }

            clearMarkers() {
                currentPathMarkers.forEach(marker => marker.remove());
                currentPathMarkers = [];
                
                document.querySelectorAll('.path-tile').forEach(el => {
                    el.classList.remove('path-tile');
                });
            }

            async calculatePath() {
                if (!startPoint || !endPoint) return;

                const pathfinder = new AStarPathfinder(mapData);
                path = pathfinder.findPath(startPoint.x, startPoint.y, endPoint.x, endPoint.y);

                if (path) {
                    console.log('Path found:', path);
                    this.highlightPath(path);
                    await this.movePlayerAlongPath(path);
                } else {
                    console.log('No path found!');
                    alert('无法找到路径！障碍物阻挡。');
                }
            }

            highlightPath(pathPoints) {
                document.querySelectorAll('.path-tile').forEach(el => {
                    el.classList.remove('path-tile');
                });

                for (const point of pathPoints) {
                    const tileElement = this.tiles.find(t => t.x === point.x && t.y === point.y);
                    if (tileElement) {
                        tileElement.element.classList.add('path-tile');
                    }
                }
            }

            async movePlayerAlongPath(pathPoints) {
                if (pathPoints.length === 0) return;

                player = document.getElementById('player');
                player.style.display = 'block';
                player.classList.add('player-walking');

                for (let i = 0; i < pathPoints.length; i++) {
                    const point = pathPoints[i];
                    await this.movePlayerTo(point.x, point.y);
                }

                player.classList.remove('player-walking');
                
                const lastPoint = pathPoints[pathPoints.length - 1];
                await this.notifyBackend(lastPoint.x, lastPoint.y);

                setTimeout(() => {
                    this.clearMarkers();
                    startPoint = null;
                    endPoint = null;
                    path = [];
                }, 1000);
            }

            async movePlayerTo(x, y) {
                const { isoX, isoY } = IsometricCoordinate.cartesianToIsometric(x, y);
                const tile = mapData[y][x];
                
                const targetLeft = isoX + CONFIG.tileSize / 2 - 16;
                const targetTop = isoY - tile.elevation * 10 - 20;
                
                player.style.left = `${targetLeft}px`;
                player.style.top = `${targetTop}px`;
                player.style.zIndex = Math.floor(IsometricCoordinate.getDepth(x, y, tile.elevation) + 1000);

                return new Promise(resolve => setTimeout(resolve, 300));
            }

            async notifyBackend(x, y) {
                try {
                    const response = await fetch(`${CONFIG.apiUrl}/arrival`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ x, y })
                    });
                    const result = await response.text();
                    console.log('Backend notified:', result);
                } catch (error) {
                    console.error('Failed to notify backend:', error);
                }
            }
        }

        async function loadMapData() {
            try {
                const response = await fetch(CONFIG.apiUrl);
                const data = await response.json();
                
                mapData = [];
                for (let y = 0; y < data.height; y++) {
                    mapData[y] = [];
                }
                
                for (const tile of data.tiles) {
                    mapData[tile.y][tile.x] = {
                        elevation: tile.elevation,
                        buildingTypeId: tile.buildingTypeId
                    };
                }

                document.getElementById('loading').style.display = 'none';
                
                const renderer = new MapRenderer('iso-map');
                renderer.render();
                
                console.log('Map loaded successfully');
            } catch (error) {
                console.error('Failed to load map:', error);
                document.getElementById('loading').innerHTML = '加载失败，请确保后端服务已启动';
            }
        }

        loadMapData();
    </script>
</body>
</html>
